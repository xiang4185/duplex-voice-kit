name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Swift 5.10 core tests
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run static checks
        run: python3 Scripts/static_check.py

      - name: Run debug tests
        run: swift test

      - name: Run release tests
        run: swift test -c release

  ios-simulator:
    name: iOS 26 package, showcase, and app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          set -euo pipefail
          XCODE_26_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | head -n 1)"
          test -n "$XCODE_26_APP" || { echo '::error::Xcode 26 not found'; exit 1; }
          export DEVELOPER_DIR="$XCODE_26_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Run static checks
        run: |
          set -euo pipefail
          python3 Scripts/static_check.py
          python3 Apps/XiaomaoApp/Scripts/static_check.py
          test ! -e Apps/XiaomaoApp/Config/Secrets.xcconfig

      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$({ xcrun simctl list devices available -j; } | python3 -c '
          import json
          import re
          import sys

          payload = json.load(sys.stdin)
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)(?:-(\d+))?(?:-(\d+))?$", runtime)
              if not match:
                  continue
              version = tuple(int(part) if part is not None else 0 for part in match.groups())
              if version[0] != 26:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iOS 26 iPhone Simulator found")

          candidates.sort(reverse=True)
          print(candidates[0][2])
          ')"
          echo "udid=${SIMULATOR_UDID}" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$SIMULATOR_UDID"

      - name: Boot Simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Build and test on iOS Simulator
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -euo pipefail
          xcodebuild -list
          xcodebuild \
            -scheme DuplexVoiceKit-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DuplexVoiceKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Install or confirm XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate and build Companion Showcase
        working-directory: Examples/DVKCompanionShowcase
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project DVKCompanionShowcase.xcodeproj \
            -scheme DVKCompanionShowcase \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Generate Xiaomao app project
        working-directory: Apps/XiaomaoApp
        run: |
          set -euo pipefail
          xcodegen generate
          test -d XiaomaoApp.xcodeproj

      - name: Build and test Xiaomao app
        working-directory: Apps/XiaomaoApp
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -euo pipefail
          xcodebuild \
            -project XiaomaoApp.xcodeproj \
            -scheme XiaomaoApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/XiaomaoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive Xiaomao app without secrets or signing
        working-directory: Apps/XiaomaoApp
        env:
          API_BASE_URL: ""
          VOICE_WS_URL: ""
          DEVICE_ID: ""
          BUNDLE_ID: com.example.xiaomao.publicci
        run: |
          set -euo pipefail
          test ! -e Config/Secrets.xcconfig
          ARCHIVE_PATH="$RUNNER_TEMP/XiaomaoApp-public.xcarchive"
          xcodebuild \
            -project XiaomaoApp.xcodeproj \
            -scheme XiaomaoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/XiaomaoArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_MOCK_VOICE=NO \
            ENABLE_MEMORY=NO \
            DEFAULT_VOICE_ROUTE=b \
            BUNDLE_ID="$BUNDLE_ID" \
            API_BASE_URL="$API_BASE_URL" \
            VOICE_WS_URL="$VOICE_WS_URL" \
            DEVICE_ID="$DEVICE_ID" \
            archive

          APP_PATH="$ARCHIVE_PATH/Products/Applications/XiaomaoApp.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Assets.car"
          test ! -e "$APP_PATH/embedded.mobileprovision"
          test ! -e "$APP_PATH/_CodeSignature"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :API_BASE_URL' "$APP_PATH/Info.plist")"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :VOICE_WS_URL' "$APP_PATH/Info.plist")"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :DEVICE_ID' "$APP_PATH/Info.plist")"

          PROHIBITED="$(find "$ARCHIVE_PATH" -type f \( \
            -name 'Secrets.xcconfig' -o -name '*.p12' -o -name '*.pfx' \
            -o -name '*.pem' -o -name '*.key' -o -name '*.mobileprovision' \
            -o -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.pcm' \
          \) -print -quit)"
          test -z "$PROHIBITED"
