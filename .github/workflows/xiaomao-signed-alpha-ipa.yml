name: Xiaomao Signed Alpha IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaomao-signed-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-alpha:
    name: Build signed Alpha IPA
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Apps/XiaomaoApp

    env:
      CERTIFICATE_P12_BASE64: ${{ secrets.XIAOMAO_SIGNING_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.XIAOMAO_SIGNING_CERTIFICATE_PASSWORD }}
      APP_PROFILE_BASE64: ${{ secrets.XIAOMAO_APP_PROVISIONING_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.XIAOMAO_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      API_BASE_URL: ${{ secrets.XIAOMAO_API_BASE_URL }}
      VOICE_WS_URL: ${{ secrets.XIAOMAO_VOICE_WS_URL }}
      DEVICE_ID: ${{ secrets.XIAOMAO_DEVICE_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.XIAOMAO_DEVELOPMENT_TEAM }}
      BUNDLE_ID: ${{ secrets.XIAOMAO_BUNDLE_ID }}
      EXPORT_METHOD: ${{ secrets.XIAOMAO_EXPORT_METHOD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_26_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | head -n 1)"
          test -n "$XCODE_26_APP" || { echo '::error::Xcode 26 not found'; exit 1; }
          echo "DEVELOPER_DIR=$XCODE_26_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Report missing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          while IFS='|' read -r name value; do
            [[ -n "$value" ]] || missing+=("$name")
          done <<EOF
          XIAOMAO_SIGNING_CERTIFICATE_P12_BASE64|$CERTIFICATE_P12_BASE64
          XIAOMAO_SIGNING_CERTIFICATE_PASSWORD|$CERTIFICATE_PASSWORD
          XIAOMAO_APP_PROVISIONING_PROFILE_BASE64|$APP_PROFILE_BASE64
          XIAOMAO_WIDGET_PROVISIONING_PROFILE_BASE64|$WIDGET_PROFILE_BASE64
          XIAOMAO_API_BASE_URL|$API_BASE_URL
          XIAOMAO_VOICE_WS_URL|$VOICE_WS_URL
          XIAOMAO_DEVICE_ID|$DEVICE_ID
          XIAOMAO_DEVELOPMENT_TEAM|$DEVELOPMENT_TEAM
          XIAOMAO_BUNDLE_ID|$BUNDLE_ID
          XIAOMAO_EXPORT_METHOD|$EXPORT_METHOD
          EOF
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions Secret: %s\n' "${missing[@]}"
            exit 2
          fi

      - name: Validate protected configuration
        run: |
          set -euo pipefail
          [[ "${API_BASE_URL%%:*}" == https ]] || { echo '::error::XIAOMAO_API_BASE_URL must use HTTPS'; exit 3; }
          [[ "${VOICE_WS_URL%%:*}" == wss ]] || { echo '::error::XIAOMAO_VOICE_WS_URL must use WSS'; exit 3; }
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo '::error::XIAOMAO_BUNDLE_ID is invalid'; exit 3; }
          [[ "$EXPORT_METHOD" =~ ^(development|ad-hoc)$ ]] || { echo '::error::XIAOMAO_EXPORT_METHOD must be development or ad-hoc'; exit 3; }
          test ! -e Config/Secrets.xcconfig

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Import signing material and inject configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/xiaomao-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/xiaomao-signing.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/xiaomao-app.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/xiaomao-widget.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          decode_profile() {
            security cms -D -i "$1" > "$2"
          }
          decode_profile "$APP_PROFILE_PATH" "$RUNNER_TEMP/app-profile.plist"
          decode_profile "$WIDGET_PROFILE_PATH" "$RUNNER_TEMP/widget-profile.plist"
          APP_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")"
          APP_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app-profile.plist")"
          WIDGET_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget-profile.plist")"
          WIDGET_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")"
          cp "$APP_PROFILE_PATH" "$PROFILE_DIR/$APP_PROFILE_UUID.mobileprovision"
          cp "$WIDGET_PROFILE_PATH" "$PROFILE_DIR/$WIDGET_PROFILE_UUID.mobileprovision"

          cat > Config/Secrets.xcconfig <<EOF
          HOST_ADAPTER_MODE = production
          API_BASE_URL = $API_BASE_URL
          VOICE_WS_URL = $VOICE_WS_URL
          DEVICE_ID = $DEVICE_ID
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          BUNDLE_ID = $BUNDLE_ID
          APP_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_NAME
          WIDGET_PROVISIONING_PROFILE_SPECIFIER = $WIDGET_PROFILE_NAME
          EOF
          chmod 600 Config/Secrets.xcconfig

          {
            echo "keychain_path=$KEYCHAIN_PATH"
            echo "app_profile_uuid=$APP_PROFILE_UUID"
            echo "app_profile_name=$APP_PROFILE_NAME"
            echo "widget_profile_uuid=$WIDGET_PROFILE_UUID"
            echo "widget_profile_name=$WIDGET_PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Run privacy-safe checks and generate project
        run: |
          set -euo pipefail
          python3 ../../Scripts/static_check.py
          python3 Scripts/static_check.py
          xcodegen generate
          test -d XiaomaoApp.xcodeproj

      - name: Archive signed application
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/XiaomaoApp.xcarchive"
          xcodebuild \
            -project XiaomaoApp.xcodeproj \
            -scheme XiaomaoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            BUNDLE_ID="$BUNDLE_ID" \
            APP_BUILD_SHA="${GITHUB_SHA:0:12}" \
            APP_BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            archive

      - name: Export signed IPA
        id: export
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/XiaomaoApp.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/xiaomao-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          ARTIFACT_DIR="$RUNNER_TEMP/xiaomao-artifact"
          mkdir -p "$EXPORT_DIR" "$ARTIFACT_DIR"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>${{ steps.signing.outputs.app_profile_name }}</string>
              <key>$BUNDLE_ID.widgets</key><string>${{ steps.signing.outputs.widget_profile_name }}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          cp "$IPA_PATH" "$ARTIFACT_DIR/XiaomaoApp-Alpha.ipa"
          IPA="$ARTIFACT_DIR/XiaomaoApp-Alpha.ipa"
          IPA_SIZE="$(stat -f '%z' "$IPA")"
          SHA256="$(shasum -a 256 "$IPA" | awk '{print $1}')"

          VERIFY_DIR="$RUNNER_TEMP/xiaomao-verify"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          VERIFIED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$VERIFIED_BUNDLE_ID" = "$BUNDLE_ID"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"

          ARTIFACT_NAME="xiaomao-alpha-signed-${GITHUB_SHA:0:7}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "ipa_size=$IPA_SIZE"
            echo "sha256=$SHA256"
            echo "bundle_id=$VERIFIED_BUNDLE_ID"
            echo "signature_verified=true"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Signed Alpha IPA'
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Artifact: $ARTIFACT_NAME"
            echo "- IPA bytes: $IPA_SIZE"
            echo "- SHA256: $SHA256"
            echo "- Bundle ID: $VERIFIED_BUNDLE_ID"
            echo '- Signature verified: true'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed IPA only
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/xiaomao-artifact/XiaomaoApp-Alpha.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Clean signing and configuration material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f Config/Secrets.xcconfig
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.app_profile_uuid }}.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.widget_profile_uuid }}.mobileprovision"
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" 2>/dev/null
          rm -f "$RUNNER_TEMP/xiaomao-signing.p12" \
                "$RUNNER_TEMP/xiaomao-app.mobileprovision" \
                "$RUNNER_TEMP/xiaomao-widget.mobileprovision" \
                "$RUNNER_TEMP/app-profile.plist" \
                "$RUNNER_TEMP/widget-profile.plist" \
                "$RUNNER_TEMP/ExportOptions.plist"
