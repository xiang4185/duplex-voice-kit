name: Bug report
description: Report a reproducible DuplexVoiceKit defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, production endpoints, user audio, transcripts, or private identifiers.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: DVK revision
      description: Commit SHA, branch, or version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: iOS, Xcode, Swift, device or Simulator, using non-sensitive details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic events and audio only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Include only DVK privacy-safe diagnostics and remove application-specific data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, production endpoints, user content, and private identifiers.
          required: true
