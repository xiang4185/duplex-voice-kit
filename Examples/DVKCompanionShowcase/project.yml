name: DVKCompanionShowcase
options:
  bundleIdPrefix: org.example
packages:
  DuplexVoiceKit:
    path: ../..
targets:
  DVKCompanionShowcase:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [DVKCompanionShowcase]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.DVKCompanionShowcase
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: DuplexVoiceKit
        product: DuplexVoiceKitUI
